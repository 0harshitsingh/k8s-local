apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: default
spec:
  selector:
    app: backend
  ports:
  - port: 80
    targetPort: 80
---
# Authorized Frontend Pod
apiVersion: v1
kind: Pod
metadata:
  name: frontend-pod
  namespace: default
  labels:
    role: frontend
spec:
  containers:
  - name: curl
    image: curlimages/curl
    command: ["sleep", "3600"]
---
# Unauthorized / Rogue Pod
apiVersion: v1
kind: Pod
metadata:
  name: rogue-pod
  namespace: default
  labels:
    role: rogue
spec:
  containers:
  - name: curl
    image: curlimages/curl
    command: ["sleep", "3600"]
