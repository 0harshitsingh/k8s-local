apiVersion: v1
kind: Namespace
metadata:
  name: voting-mesh
---
# --- CANDIDATE ALICE ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: candidate-alice
  namespace: voting-mesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: candidate-alice
  template:
    metadata:
      labels:
        app: candidate-alice
    spec:
      containers:
      - name: alice
        image: hashicorp/http-echo:latest
        args:
        - "-text=Vote recorded for Candidate Alice 🗳️"
        ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: candidate-alice
  namespace: voting-mesh
spec:
  ports:
  - port: 80
    targetPort: 5678
  selector:
    app: candidate-alice
---
# --- CANDIDATE BOB ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: candidate-bob
  namespace: voting-mesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: candidate-bob
  template:
    metadata:
      labels:
        app: candidate-bob
    spec:
      containers:
      - name: bob
        image: hashicorp/http-echo:latest
        args:
        - "-text=Vote recorded for Candidate Bob 🗳️"
        ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: candidate-bob
  namespace: voting-mesh
spec:
  ports:
  - port: 80
    targetPort: 5678
  selector:
    app: candidate-bob
---
# --- CANDIDATE CHARLIE ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: candidate-charlie
  namespace: voting-mesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: candidate-charlie
  template:
    metadata:
      labels:
        app: candidate-charlie
    spec:
      containers:
      - name: charlie
        image: hashicorp/http-echo:latest
        args:
        - "-text=Vote recorded for Candidate Charlie 🗳️"
        ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: candidate-charlie
  namespace: voting-mesh
spec:
  ports:
  - port: 80
    targetPort: 5678
  selector:
    app: candidate-charlie
---
# --- AUTOMATED VOTE BOT (Traffic Generator) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote-bot
  namespace: voting-mesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote-bot
  template:
    metadata:
      labels:
        app: vote-bot
    spec:
      containers:
      - name: vote-bot
        image: curlimages/curl:latest
        command:
        - /bin/sh
        - -c
        - |
          while true; do
            curl -s http://candidate-alice
            curl -s http://candidate-bob
            curl -s http://candidate-charlie
            sleep 1
          done
