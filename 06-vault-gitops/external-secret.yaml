apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials-external
  namespace: default
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: db-app-secret
    creationPolicy: Owner
  data:
  - secretKey: DB_USER
    remoteRef:
      key: secret/db-pass
      property: username
  - secretKey: DB_PASSWORD
    remoteRef:
      key: secret/db-pass
      property: password
